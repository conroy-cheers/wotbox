[package]
name = "wotbox"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "A Gazelle tracker and torrent client manager"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["http2", "macros", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
hex = "0.4"
include_dir = "0.7"
mime_guess = "2.0"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "multipart", "query", "rustls", "stream"] }
sea-orm = { version = "2.0", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "with-json"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.0", features = ["full"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["compression-gzip", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5.0", features = ["axum_extras", "chrono", "uuid"] }
url = "2.5"
unicode-normalization = "0.1"
uuid = { version = "1.0", features = ["serde", "v4"] }

[dev-dependencies]
http = "1.0"
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
